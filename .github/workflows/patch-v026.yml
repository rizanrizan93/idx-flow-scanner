name: Patch v0.2.6 Bulk Cache

on:
  push:
    branches:
      - audit/v0.2.6-bulk-price-cache
    paths:
      - '.github/workflows/patch-v026.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v0.2.6-bulk-price-cache
      - name: Patch managed heartbeat and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          if 'APP_VERSION = "0.2.5"' not in text:
              raise SystemExit('APP_VERSION marker not found')
          text = text.replace('APP_VERSION = "0.2.5"', 'APP_VERSION = "0.2.6"', 1)

          old = '''    load_price, price_stats = prepare_database_first_prices(\n        universe,\n        store,\n        period=period,\n        min_rows=config.minimum_price_bars,\n        status=lambda text: status_box.caption(text),\n    )\n'''
          new = '''    def price_status(text: str) -> None:\n        status_box.caption(text)\n        if store is not None and run_record_created:\n            store.update_run_progress(run_id, 0, "OHLCV_PREP")\n\n    load_price, price_stats = prepare_database_first_prices(\n        universe,\n        store,\n        period=period,\n        min_rows=config.minimum_price_bars,\n        status=price_status,\n    )\n'''
          if old not in text:
              raise SystemExit('prepare_database_first_prices marker not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '"price_integrity_gate": True,\n                    "oos_outcome_memory": True,',
              '"price_integrity_gate": True,\n                    "bulk_price_cache_rpc": True,\n                    "oos_outcome_memory": True,',
              1,
          )
          app.write_text(text, encoding='utf-8')

          test = Path('tests/test_bulk_price_cache.py')
          test.write_text('''import pandas as pd\n\nfrom idx_flow_scanner.database_first import prepare_database_first_prices\n\n\ndef _frame(ticker: str, rows: int = 90) -> pd.DataFrame:\n    dates = pd.date_range("2026-01-01", periods=rows, freq="D")\n    return pd.DataFrame({\n        "ticker": [ticker] * rows,\n        "date": dates,\n        "open": range(100, 100 + rows),\n        "high": range(101, 101 + rows),\n        "low": range(99, 99 + rows),\n        "close": range(100, 100 + rows),\n        "volume": [1000] * rows,\n    })\n\n\ndef test_prepare_database_first_prices_prefers_bulk_store(monkeypatch):\n    class BulkStore:\n        def __init__(self):\n            self.bulk_calls = 0\n            self.single_calls = 0\n\n        def load_prices_bulk(self, tickers, *, min_rows=80, limit=450, chunk_size=20, progress=None):\n            self.bulk_calls += 1\n            if progress:\n                progress(len(tickers), len(tickers), len(tickers))\n            return {ticker: _frame(ticker) for ticker in tickers}\n\n        def load_prices(self, ticker, min_rows=80):\n            self.single_calls += 1\n            raise AssertionError("single-ticker DB path must not run when bulk RPC succeeds")\n\n    def fail_fetch(*args, **kwargs):\n        raise AssertionError("Yahoo must not run when bulk cache is complete")\n\n    monkeypatch.setattr("idx_flow_scanner.database_first.fetch_yfinance_prices_batch", fail_fetch)\n    store = BulkStore()\n    messages = []\n    loader, stats = prepare_database_first_prices(\n        ["AAA", "BBB"], store, period="1y", status=messages.append\n    )\n\n    assert store.bulk_calls == 1\n    assert store.single_calls == 0\n    assert stats["bulk_cache_used"] is True\n    assert stats["cache_hits"] == 2\n    assert stats["unavailable"] == 0\n    assert len(loader("AAA")) == 90\n    assert any("2/2" in message for message in messages)\n\n\ndef test_bulk_store_incomplete_subset_uses_seed_not_single_db(monkeypatch, tmp_path):\n    seed = pd.concat([_frame("BBB")], ignore_index=True)\n    seed_path = tmp_path / "seed.csv.gz"\n    seed.to_csv(seed_path, index=False, compression="gzip")\n\n    class BulkStore:\n        def __init__(self):\n            self.single_calls = 0\n            self.persisted = []\n\n        def load_prices_bulk(self, tickers, **kwargs):\n            return {"AAA": _frame("AAA")}\n\n        def load_prices(self, ticker, min_rows=80):\n            self.single_calls += 1\n            return pd.DataFrame()\n\n        def upsert_prices(self, ticker, frame, source="YFINANCE"):\n            self.persisted.append((ticker, source))\n            return len(frame)\n\n    monkeypatch.setattr(\n        "idx_flow_scanner.database_first.fetch_yfinance_prices_batch",\n        lambda *args, **kwargs: {},\n    )\n    store = BulkStore()\n    loader, stats = prepare_database_first_prices(\n        ["AAA", "BBB"], store, period="1y", seed_path=seed_path\n    )\n\n    assert store.single_calls == 0\n    assert stats["cache_hits"] == 1\n    assert stats["seed_hits"] == 1\n    assert stats["unavailable"] == 0\n    assert len(loader("BBB")) == 90\n''', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py tests/test_bulk_price_cache.py
          git commit -m "Heartbeat managed OHLCV prep and test bulk cache"
          git push origin HEAD:audit/v0.2.6-bulk-price-cache
