name: Inspect KSEI Archive

on:
  push:
    branches:
      - fix/foreign700-freefloat-semantics
    paths:
      - '.github/workflows/bootstrap-stock-summary-700.yml'
      - 'scripts/inspect_ksei_archive.py'

permissions:
  contents: read

jobs:
  inspect-ksei:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inspect KSEI July 2026 archive
        run: python scripts/inspect_ksei_archive.py
