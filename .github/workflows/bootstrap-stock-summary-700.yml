name: Backfill KSEI Ownership History

on:
  push:
    branches:
      - fix/foreign700-freefloat-semantics
    paths:
      - '.github/workflows/bootstrap-stock-summary-700.yml'
      - 'scripts/backfill_ksei_ownership_history.py'

permissions:
  contents: write

jobs:
  backfill-ksei:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build verified KSEI 2026 ownership history
        run: python scripts/backfill_ksei_ownership_history.py
      - name: Commit verified KSEI mirrors
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/ksei_ownership_history_2026.csv.gz \
                  data/cache/ksei_ownership_history_2026.json
          if git diff --cached --quiet; then
            echo "No KSEI evidence change"
          else
            git commit -m "Backfill verified KSEI ownership history [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
