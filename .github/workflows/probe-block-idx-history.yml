name: Probe Block IDX History

on:
  push:
    branches:
      - evidence-expansion/block-idx-historical-backfill
    paths:
      - 'scripts/probe_block_idx_history.py'
      - '.github/workflows/probe-block-idx-history.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe Block IDX history route contract
        run: PYTHONPATH=src python scripts/probe_block_idx_history.py
