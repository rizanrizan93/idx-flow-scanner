name: Public IDX Participant Flow

on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * 1-5'
  push:
    paths:
      - 'scripts/build_public_participant_cache.py'
      - 'src/idx_flow_scanner/providers/public_idx_participant.py'
      - 'tests/test_public_idx_participant.py'
      - '.github/workflows/public-participant-flow.yml'

permissions:
  contents: write

concurrency:
  group: public-idx-participant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run public participant regression
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_public_idx_participant.py
      - name: Refresh rolling participant cache
        env:
          PYTHONPATH: src
          IDX_PUBLIC_PARTICIPANT_TARGET_DAYS: '20'
          IDX_PUBLIC_PARTICIPANT_MAX_CALENDAR_DAYS: '45'
        run: python scripts/build_public_participant_cache.py
      - name: Validate cache contract
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip
          import pandas as pd

          path = Path('data/cache/idx_public_participant_30d.csv.gz')
          if not path.exists():
              raise SystemExit('PUBLIC_PARTICIPANT_CACHE_MISSING')
          with gzip.open(path, 'rb') as handle:
              frame = pd.read_csv(handle)
          required = {
              'ticker','trade_date','participant','net_value','net_volume',
              'side','flow_rank','participant_flow_source','participant_flow_version'
          }
          missing = required - set(frame.columns)
          if missing:
              raise SystemExit(f'PUBLIC_PARTICIPANT_CACHE_COLUMNS_MISSING:{sorted(missing)}')
          frame['trade_date'] = pd.to_datetime(frame['trade_date'], errors='coerce').dt.normalize()
          latest = frame['trade_date'].max()
          latest_tickers = int(frame.loc[frame['trade_date'].eq(latest), 'ticker'].nunique()) if pd.notna(latest) else 0
          print({'latest_trade_date': str(latest.date()) if pd.notna(latest) else None, 'latest_tickers': latest_tickers, 'rows': len(frame), 'days': int(frame['trade_date'].nunique())})
          if latest_tickers < 360:
              raise SystemExit(f'LATEST_PARTICIPANT_CACHE_COVERAGE_LT_360:{latest_tickers}/400')
          if int(frame['trade_date'].nunique()) < 1:
              raise SystemExit('PUBLIC_PARTICIPANT_CACHE_NO_DATES')
          PY
      - name: Commit semantic cache changes only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/idx_public_participant_30d.csv.gz data/cache/public_participant_meta.json
          if git diff --cached --quiet; then
            echo 'Participant cache unchanged; no commit.'
          else
            git commit -m 'Refresh public IDX participant-flow cache'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi