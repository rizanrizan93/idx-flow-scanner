name: Gate 3 Official Portal Archive Probe

on:
  push:
    branches:
      - evidence-v5/financial-facts-ingest-staging
    paths:
      - '.github/workflows/gate3-portal-archive-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe official legacy portal archive
        run: |
          PYTHONPATH=src:. python - <<'PY'
          import hashlib,json
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import quote
          from zipfile import is_zipfile
          from curl_cffi import requests

          ids={
            'BLOCKIDX-FILING-0d907e3492e16a634bff6d32024fa1f5',
            'BLOCKIDX-FILING-6caf1b958e5011e942001bbfe37461c6',
            'BLOCKIDX-FILING-f449718babbd82c224485c0ffc7d1764',
          }
          src=json.loads(Path('data/cache/evidence_v5/block_idx_historical_financial_filings.json').read_text())
          rows=[r for r in src.get('rows',[]) if str(r.get('filing_id') or '') in ids]
          base='Portals/0/StaticData/ListedCompanies/Corporate_Actions/New_Info_JSX/Jenis_Informasi/01_Laporan_Keuangan/02_Soft_Copy_Laporan_Keuangan'
          out=[]
          for row in rows:
            period=str(row.get('report_period') or '').upper()
            folders=[period]
            if period=='AUDIT': folders=['Audit','AUDIT','Tahunan']
            item={'ticker':row.get('ticker'),'filing_id':row.get('filing_id'),'report_year':row.get('report_year'),'report_period':period,'published_at':row.get('published_at'),'candidates':[]}
            for folder in folders:
              rel=f"/{base}/Laporan Keuangan Tahun {int(row['report_year'])}/{folder}/{row['ticker']}/instance.zip"
              encoded=quote(rel,safe='/:._-~()[]')
              for host in ('https://www.idx.id','https://idx.id'):
                url=host+encoded
                rec={'url':url}
                try:
                  s=requests.Session(impersonate='chrome')
                  r=s.get(url,headers={'Accept':'application/zip,application/octet-stream,*/*','User-Agent':'Mozilla/5.0'},timeout=20,allow_redirects=True)
                  data=bytes(r.content or b'')
                  rec.update(status=int(r.status_code),final_url=str(r.url),bytes=len(data),content_type=r.headers.get('content-type'),is_zip=bool(is_zipfile(BytesIO(data))) if data else False,sha256=hashlib.sha256(data).hexdigest() if data else None,prefix_hex=data[:16].hex())
                except Exception as exc:
                  rec['error']=f'{type(exc).__name__}: {exc}'
                item['candidates'].append(rec)
            out.append(item)
          out.sort(key=lambda x:x['ticker'])
          Path('gate3_portal_archive_probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gate3-portal-archive-probe
          path: gate3_portal_archive_probe.json
          retention-days: 7
