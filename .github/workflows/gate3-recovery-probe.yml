name: Gate 3 Recovery Probe

on:
  push:
    branches:
      - evidence-v5/financial-facts-ingest-staging
    paths:
      - '.github/workflows/gate3-recovery-probe.yml'

permissions:
  contents: read
  actions: read

jobs:
  recovery-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Download run 3 failure summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/run3
          gh run download 34194474432 \
            --repo "$GITHUB_REPOSITORY" \
            --name full-financial-facts-summary \
            --dir /tmp/run3

      - name: Build exact run 3 failed-filing source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('/tmp/run3/financial_facts_full_summary.json').read_text())
          source = json.loads(Path('data/cache/evidence_v5/block_idx_historical_financial_filings.json').read_text())
          failed_ids = {str(row.get('filing_id') or '') for row in summary.get('failures', [])}
          rows = [row for row in source.get('rows', []) if str(row.get('filing_id') or '') in failed_ids]
          missing = sorted(failed_ids - {str(row.get('filing_id') or '') for row in rows})
          if missing:
              raise SystemExit(f'run3 failed filing identities missing from canonical source: {len(missing)}')
          if len(rows) != len(failed_ids):
              raise SystemExit(f'failed filing source count mismatch: rows={len(rows)} ids={len(failed_ids)}')
          Path('/tmp/run3_failed_source.json').write_text(json.dumps({'rows': rows}, ensure_ascii=False))
          print(json.dumps({'selected_run3_failure_rows': len(rows)}, sort_keys=True))
          PY

      - name: Re-probe run 3 failures with resilient transport
        id: reprobe
        continue-on-error: true
        run: >-
          PYTHONPATH=src:. python scripts/backfill_block_idx_financial_facts_resilient.py
          --source /tmp/run3_failed_source.json
          --workers 8
          --timeout 75
          --retries 2
          --retry-passes 2
          --retry-workers 2
          --retry-retries 4
          --output /tmp/gate3_recovery_probe.json

      - name: Build recovery summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('/tmp/gate3_recovery_probe.json')
          if not src.exists():
              payload = {'status': 'NO_RECOVERY_OUTPUT'}
          else:
              data = json.loads(src.read_text())
              payload = {
                  'selected_filing_rows': data.get('selected_filing_rows'),
                  'parsed_filing_rows': data.get('parsed_filing_rows'),
                  'failed_filing_rows': data.get('failed_filing_rows'),
                  'fact_rows': data.get('fact_rows'),
                  'distinct_tickers': len(data.get('distinct_tickers') or []),
                  'distinct_metrics': data.get('distinct_metrics'),
                  'reporting_currencies': data.get('reporting_currencies'),
                  'exact_locator_resolution_rows': data.get('exact_locator_resolution_rows'),
                  'failure_class_counts': data.get('failure_class_counts'),
                  'retry_history': data.get('retry_history'),
                  'failures': data.get('failures'),
                  'production_scoring_changed': data.get('production_scoring_changed'),
              }
          Path('gate3_recovery_probe_summary.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload recovery summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3-recovery-probe-summary
          path: gate3_recovery_probe_summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce zero unresolved failures
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('gate3_recovery_probe_summary.json').read_text())
          failed = int(data.get('failed_filing_rows') or 0)
          if failed:
              raise SystemExit(f'Gate 3 recovery probe still has {failed} unresolved filings')
          if int(data.get('selected_filing_rows') or 0) != 546:
              raise SystemExit('Gate 3 recovery probe did not cover all 546 run 3 failures')
          print('GATE3_RECOVERY_PROBE_ZERO_FAILURES')
          PY
