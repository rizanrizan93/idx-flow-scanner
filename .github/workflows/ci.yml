name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest -q
      - name: Temporary official IDX workbook probe
        run: PYTHONPATH=src python scripts/probe_idx_financial_workbook.py
      - name: Upload temporary taxonomy report
        uses: actions/upload-artifact@v4
        with:
          name: financial-taxonomy-report
          path: taxonomy_report.json
          if-no-files-found: error
      - name: Temporary bounded financial fact proof
        run: >-
          PYTHONPATH=src python scripts/backfill_block_idx_financial_facts.py
          --ticker BSSR --ticker ICBP --ticker BBCA --ticker BSDE
          --latest-only --workers 4
          --output financial_facts_proof.json
      - name: Upload temporary financial fact proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-facts-proof
          path: financial_facts_proof.json
          if-no-files-found: warn
