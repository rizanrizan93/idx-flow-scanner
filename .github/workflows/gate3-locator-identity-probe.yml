name: Gate 3 Locator Identity Probe

on:
  push:
    branches:
      - evidence-v5/financial-facts-ingest-staging
    paths:
      - '.github/workflows/gate3-locator-identity-probe.yml'

permissions:
  contents: read

jobs:
  locator-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve exact official locator identities
        run: |
          PYTHONPATH=src:. python - <<'PY'
          import json
          from pathlib import Path
          from idx_flow_scanner.providers.block_idx_financial_locator import resolve_exact_current_report_attachment
          from idx_flow_scanner.providers.block_idx_financial_profile_locator import resolve_exact_profile_announcement_attachment
          from idx_flow_scanner.providers.block_idx_financial_transport import download_official_idx_xbrl_attachment, OfficialIDXAttachmentDownloadError

          ids = {
              'BLOCKIDX-FILING-0d907e3492e16a634bff6d32024fa1f5',  # ABBA
              'BLOCKIDX-FILING-6caf1b958e5011e942001bbfe37461c6',  # ADES
              'BLOCKIDX-FILING-f449718babbd82c224485c0ffc7d1764',  # PIKI
          }
          source=json.loads(Path('data/cache/evidence_v5/block_idx_historical_financial_filings.json').read_text())
          rows=[r for r in source.get('rows',[]) if str(r.get('filing_id') or '') in ids]
          if len(rows)!=3:
              raise SystemExit(f'identity mismatch: {len(rows)}/3')
          out=[]
          for row in rows:
              entry={'ticker':row.get('ticker'),'filing_id':row.get('filing_id'),'published_at':row.get('published_at'),'announcement_id':row.get('announcement_id'),'original_file_url':row.get('file_url')}
              for name,resolver in [('current_report',resolve_exact_current_report_attachment),('profile',resolve_exact_profile_announcement_attachment)]:
                  try:
                      resolved=resolver(row)
                  except Exception as exc:
                      entry[name]={'resolver_error':f'{type(exc).__name__}: {exc}'}
                      continue
                  entry[name]=resolved
                  if isinstance(resolved,dict) and resolved.get('point_in_time_identity_preserved') is True and resolved.get('resolved_file_url'):
                      try:
                          data,digest,ctype,attempts=download_official_idx_xbrl_attachment(str(resolved['resolved_file_url']),timeout=20,retries=1)
                          entry[name+'_download']={'status':'OK','bytes':len(data),'sha256':digest,'content_type':ctype,'attempts':[{'transport_url':a.transport_url,'attempt':a.attempt,'status':a.status,'error_kind':a.error_kind} for a in attempts]}
                      except OfficialIDXAttachmentDownloadError as exc:
                          entry[name+'_download']={'status':'FAIL','code':exc.code,'all_not_found':exc.all_not_found,'transient':exc.transient,'attempts':[{'transport_url':a.transport_url,'attempt':a.attempt,'status':a.status,'error_kind':a.error_kind} for a in exc.attempts]}
                      except Exception as exc:
                          entry[name+'_download']={'status':'FAIL','error':f'{type(exc).__name__}: {exc}'}
              out.append(entry)
          out.sort(key=lambda r:r['ticker'])
          Path('gate3_locator_identity_probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gate3-locator-identity-probe
          path: gate3_locator_identity_probe.json
          retention-days: 7
