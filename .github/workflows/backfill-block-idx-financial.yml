name: Backfill Block IDX Financial Evidence

on:
  push:
    branches:
      - evidence-expansion/block-idx-historical-backfill
    paths:
      - 'src/idx_flow_scanner/providers/block_idx_financial_history.py'
      - 'src/idx_flow_scanner/providers/block_idx_financial_revisions.py'
      - 'scripts/backfill_block_idx_financial_evidence.py'
      - 'tests/test_block_idx_financial_history.py'
      - 'tests/test_block_idx_financial_revisions.py'
      - 'tests/test_block_idx_historical_financial_ingest_contract.py'
      - 'supabase/migrations/20260908070500_block_idx_historical_financial_cache.sql'
      - '.github/workflows/backfill-block-idx-financial.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: block-idx-financial-backfill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backfill-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Block IDX financial history contract tests
        run: >-
          PYTHONPATH=src:. pytest -q
          tests/test_block_idx_financial_history.py
          tests/test_block_idx_financial_revisions.py
          tests/test_block_idx_historical_financial_ingest_contract.py
          tests/test_block_idx_evidence.py
      - name: Build full retained revision-complete PIT financial cache
        env:
          PYTHONPATH: src
        run: >-
          python scripts/backfill_block_idx_financial_evidence.py
          --start 2023-09-08
          --end 2026-09-08
          --report-year-start 2022
          --report-year-end 2026
          --download-smoke 3
      - name: Enforce historical filing evidence gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/cache/evidence_v5/block_idx_historical_financial_backfill_meta.json')
          meta = json.loads(path.read_text(encoding='utf-8'))
          revision = meta['revision_backfill']
          dedupe = meta['profile_reply_dedupe']
          corroboration = meta['latest_report_corroboration']
          failures = []

          if revision['unresolved_structured_announcements'] != 0:
              failures.append(f"unresolved_structured={revision['unresolved_structured_announcements']}")
          if revision['skipped_nonofficial_attachments'] != 0:
              failures.append(f"nonofficial_attachments={revision['skipped_nonofficial_attachments']}")
          if revision['structured_financial_announcements'] != revision['inferred_announcements']:
              failures.append(
                  f"structured_vs_inferred={revision['structured_financial_announcements']}/{revision['inferred_announcements']}"
              )
          anomaly_reasons = {row.get('reason') for row in revision.get('anomaly_samples', [])}
          unexpected = sorted(reason for reason in anomaly_reasons if reason != 'SOURCE_PERIOD_CONFLICT_REJECTED')
          if unexpected:
              failures.append(f"unexpected_anomaly_reasons={unexpected}")
          if corroboration['skipped_attachment_identity'] != 0:
              failures.append(f"corroboration_attachment_identity={corroboration['skipped_attachment_identity']}")
          if dedupe['deduped_profile_replies'] > dedupe['input_profile_replies']:
              failures.append('profile_reply_dedupe_count_invalid')
          if meta.get('production_scoring_changed') is not False:
              failures.append('production_scoring_changed')

          print(json.dumps({
              'gate': 'PASS' if not failures else 'FAIL',
              'failures': failures,
              'revision_filing_rows': revision['filing_rows'],
              'structured_financial_announcements': revision['structured_financial_announcements'],
              'source_period_conflict_rejections': revision['skipped_non_pit_announcements'],
              'duplicate_profile_replies_merged': dedupe['duplicate_profile_replies_merged'],
          }, sort_keys=True))
          if failures:
              raise SystemExit(2)
          PY
      - name: Publish backfill telemetry
        if: always()
        run: |
          echo '## Block IDX full historical financial backfill' >> "$GITHUB_STEP_SUMMARY"
          cat data/cache/evidence_v5/block_idx_historical_financial_backfill_meta.json 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit historical cache
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/evidence_v5/block_idx_historical_financial_filings.json data/cache/evidence_v5/block_idx_historical_financial_backfill_meta.json
          if git diff --cached --quiet; then
            echo "Historical financial evidence unchanged"
          else
            git commit -m "Backfill full retained Block IDX PIT financial evidence"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
