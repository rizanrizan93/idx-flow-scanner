name: Probe Direct IDX Foreign Flow

on:
  push:
    branches:
      - fix/foreign700-freefloat-semantics
    paths:
      - 'scripts/probe_idx_direct_foreign.py'
      - '.github/workflows/probe-idx-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/probe_idx_direct_foreign.py
