name: Public IDX broker flow cache

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/build_idx_broker_cache.py"
      - "src/idx_flow_scanner/providers/idx_official.py"
      - "src/idx_flow_scanner/providers/public_idx_participant.py"
      - ".github/workflows/public-broker-flow.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install lightweight collector dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas requests
      - name: Refresh canonical broker evidence telemetry
        env:
          PYTHONPATH: src
          IDX_BROKER_UNIVERSE_DAILY_BUDGET: '400'
          IDX_BROKER_WORKERS: '12'
          IDX_BROKER_TARGET_DAYS: '20'
          IDX_BROKER_MAX_CALENDAR_DAYS: '45'
        run: python scripts/build_idx_broker_cache.py
      - name: Validate canonical broker source state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          meta_path = Path('data/cache/idx_official_broker_meta.json')
          cache_path = Path('data/cache/idx_official_broker_60d.csv.gz')
          if not meta_path.exists():
              raise SystemExit('IDX_BROKER_META_MISSING')
          meta = json.loads(meta_path.read_text())
          status = str(meta.get('status') or '').upper()
          if not cache_path.exists():
              if status.startswith('BLOCKED') or status.startswith('ERROR') or status in {'NO_DATA','SOURCE_UNAVAILABLE'}:
                  print({'broker_cache_state':'SOURCE_UNAVAILABLE_FAIL_CLOSED', **meta})
                  raise SystemExit(0)
              raise SystemExit(f'IDX_BROKER_CACHE_MISSING_UNEXPECTED:{meta}')
          df = pd.read_csv(cache_path)
          required = {'ticker','trade_date','broker_code','buy_value','sell_value','source','provenance_state'}
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f'IDX_BROKER_CACHE_COLUMNS_MISSING:{sorted(missing)}')
          print({
              'broker_cache_state':'AVAILABLE',
              'rows':len(df),
              'tickers':int(df['ticker'].nunique()),
              'days':int(pd.to_datetime(df['trade_date'],errors='coerce').nunique()),
              'provider_status':meta.get('status'),
          })
          PY
