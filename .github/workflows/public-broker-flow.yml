name: Public IDX broker flow cache

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-5"
  push:
    branches: [main]
    paths:
      - "public_idx_broker_flow.py"
      - "scripts/update_public_broker_flow.py"
      - ".github/workflows/public-broker-flow.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install lightweight collector dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas requests
      - name: Refresh rolling broker cache
        run: python scripts/update_public_broker_flow.py
      - name: Validate daily 400-ticker coverage
        run: |
          python - <<'PY'
          import gzip
          from pathlib import Path
          import pandas as pd
          path = Path('data/public_broker_flow_30d.csv.gz')
          if not path.exists():
              raise SystemExit('PUBLIC_BROKER_CACHE_MISSING')
          with gzip.open(path, 'rb') as handle:
              df = pd.read_csv(handle)
          required = {'ticker','trade_date','broker_code','buy_value','sell_value','net_value','source_verified','provenance_state'}
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f'PUBLIC_BROKER_CACHE_COLUMNS_MISSING:{sorted(missing)}')
          df['trade_date'] = pd.to_datetime(df['trade_date'], errors='coerce').dt.normalize()
          latest = df['trade_date'].max()
          latest_tickers = int(df.loc[df['trade_date'].eq(latest),'ticker'].nunique()) if pd.notna(latest) else 0
          print({'latest_trade_date': str(latest.date()) if pd.notna(latest) else None, 'latest_tickers': latest_tickers, 'rows': len(df), 'days': int(df['trade_date'].nunique())})
          if latest_tickers < 360:
              raise SystemExit(f'LATEST_PARTICIPANT_FLOW_COVERAGE_TOO_LOW:{latest_tickers}/400')
          if int(df['trade_date'].nunique()) < 1:
              raise SystemExit('NO_TRADE_DATES_IN_CACHE')
          PY
      - name: Commit updated cache
        run: |
          if git diff --quiet -- data/public_broker_flow_30d.csv.gz; then
            echo "No cache update; likely market holiday or source unavailable."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public_broker_flow_30d.csv.gz
          git commit -m "data: refresh public IDX broker flow cache"
          git push