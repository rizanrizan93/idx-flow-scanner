name: Publish Financial Facts Artifact

on:
  push:
    branches: [evidence-v5/financial-facts]
    paths:
      - '.github/workflows/publish-financial-facts-artifact.yml'
      - 'scripts/shard_block_idx_financial_facts.py'
      - 'scripts/prove_financial_fact_artifact.py'
      - 'tests/test_shard_block_idx_financial_facts.py'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-financial-facts-artifact
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: '34225525473'
      SOURCE_HEAD_SHA: de0bcfffafe1feb04cd23b2ad560a50d050a42fd
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Permanent parser and Gate 3–4 regression contracts
        run: >-
          pytest -q tests/test_block_idx_financial_facts.py
          tests/test_block_idx_financial_locator.py
          tests/test_block_idx_financial_profile_locator.py
          tests/test_block_idx_financial_transport.py
          tests/test_gate3_financial_facts_closure.py
          tests/test_shard_block_idx_financial_facts.py
      - name: Resolve immutable Gate 3 source and prove parser unchanged
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > /tmp/source-run.json
          python - <<'PY'
          import json, os
          r=json.load(open('/tmp/source-run.json'))
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']==os.environ['SOURCE_HEAD_SHA']
          assert r['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert r['path']=='.github/workflows/full-financial-facts-proof.yml'
          PY
          git diff --exit-code "$SOURCE_HEAD_SHA" HEAD -- \
            src/idx_flow_scanner/providers/block_idx_financial_facts.py \
            src/idx_flow_scanner/providers/block_idx_financial_locator.py \
            src/idx_flow_scanner/providers/block_idx_financial_profile_locator.py \
            src/idx_flow_scanner/providers/block_idx_financial_transport.py \
            scripts/close_gate3_financial_facts.py \
            scripts/backfill_block_idx_financial_facts_resilient.py \
            data/cache/evidence_v5/block_idx_historical_financial_filings.json
      - name: Download exact immutable Gate 3 archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate3-source
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10055637731/zip" > /tmp/cache.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10055635387/zip" > /tmp/summary.zip
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          expected = {
            'cache': ('8f369a9e36fa79d0e5e87f17dbc5e4a572f8c8c7e8d07282fb12a88dcba0da0e', 'block_idx_financial_facts_full.json'),
            'summary': ('cee1607e5f6a87fcbb88b772299830283802e579267d5037d02345f557e880b9', 'financial_facts_full_summary.json'),
          }
          for name, (digest, member) in expected.items():
              data=Path('/tmp/'+name+'.zip').read_bytes()
              assert hashlib.sha256(data).hexdigest()==digest, 'source archive hash mismatch'
              with zipfile.ZipFile('/tmp/'+name+'.zip') as archive:
                  assert archive.namelist()==[member], 'unexpected source archive member'
                  Path('/tmp/gate3-source',member).write_bytes(archive.read(member))
          PY
      - name: Build and independently reproduce all immutable artifacts
        run: >-
          python scripts/prove_financial_fact_artifact.py
          --source /tmp/gate3-source/block_idx_financial_facts_full.json
          --summary /tmp/gate3-source/financial_facts_full_summary.json
          --historical data/cache/evidence_v5/block_idx_historical_financial_filings.json
          --out /tmp/gate4-artifacts --proof /tmp/gate4-proof.json
      - name: Verify manifest and every shard again before publication
        run: >-
          python scripts/prove_financial_fact_artifact.py
          --source /tmp/gate3-source/block_idx_financial_facts_full.json
          --summary /tmp/gate3-source/financial_facts_full_summary.json
          --historical data/cache/evidence_v5/block_idx_historical_financial_filings.json
          --out /tmp/gate4-artifacts --proof /tmp/gate4-proof.json --verify-existing
      - name: Publish to artifact-only branch without replacing historical evidence
        id: publish
        run: |
          set -euo pipefail
          TARGET_BRANCH=evidence-v5/financial-facts-artifacts
          TARGET_DIR="evidence_artifacts/financial_facts_v5/run-${SOURCE_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$TARGET_BRANCH"
            git checkout -b gate4-publish FETCH_HEAD
          else
            git checkout --orphan gate4-publish
            git rm -rf . >/dev/null
          fi
          mkdir -p "$TARGET_DIR"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('evidence_artifacts/financial_facts_v5/run-'+os.environ['SOURCE_RUN_ID'])
          for path in Path('/tmp/gate4-artifacts').iterdir():
              target=root/path.name
              if target.exists() and target.read_bytes()!=path.read_bytes():
                  raise SystemExit('IMMUTABLE_ARTIFACT_CONFLICT:'+path.name)
              target.write_bytes(path.read_bytes())
          metadata={
              'schema_version':'BLOCK_IDX_FINANCIAL_FACT_ARTIFACT_META_V5_3',
              'source_run_id':int(os.environ['SOURCE_RUN_ID']),
              'source_head_sha':os.environ['SOURCE_HEAD_SHA'],
              'manifest_sha256':hashlib.sha256((root/'manifest.json').read_bytes()).hexdigest(),
              'production_scoring_changed':False,
          }
          raw=(json.dumps(metadata,sort_keys=True,separators=(',',':'))+'\n').encode()
          target=root/'artifact_meta.json'
          if target.exists() and target.read_bytes()!=raw:
              raise SystemExit('IMMUTABLE_METADATA_CONFLICT')
          target.write_bytes(raw)
          PY
          git add "$TARGET_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Evidence v5: immutable Gate 4 corpus and exclusions from run ${SOURCE_RUN_ID}"
          fi
          git push origin HEAD:"$TARGET_BRANCH"
          ARTIFACT_COMMIT_SHA=$(git rev-parse HEAD)
          export ARTIFACT_COMMIT_SHA
          python - <<'PY'
          import json, os
          from pathlib import Path
          proof=json.loads(Path('/tmp/gate4-proof.json').read_text())
          proof.update(artifact_commit_sha=os.environ['ARTIFACT_COMMIT_SHA'],
                       gate4_workflow_run_id=int(os.environ['GITHUB_RUN_ID']),
                       gate4_code_head_sha=os.environ['GITHUB_SHA'])
          proof['manifest_url']='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/'+proof['artifact_commit_sha']+'/evidence_artifacts/financial_facts_v5/run-'+os.environ['SOURCE_RUN_ID']+'/manifest.json'
          Path('/tmp/gate4-publication-receipt.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          print(json.dumps(proof,sort_keys=True))
          PY
      - name: Upload Gate 4 proof and immutable publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate4-proof-and-receipt
          path: |
            /tmp/gate4-proof.json
            /tmp/gate4-publication-receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload deterministic manifest shards and exclusion ledger
        uses: actions/upload-artifact@v4
        with:
          name: full-financial-facts-shards
          path: /tmp/gate4-artifacts
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
