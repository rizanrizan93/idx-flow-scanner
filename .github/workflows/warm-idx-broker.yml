name: Warm IDX Broker Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '55 12 * * *'
  push:
    paths:
      - 'scripts/build_idx_broker_cache.py'
      - 'scripts/build_public_participant_cache.py'
      - 'src/idx_flow_scanner/providers/idx_official.py'
      - 'src/idx_flow_scanner/providers/public_idx_participant.py'
      - '.github/workflows/warm-idx-broker.yml'

permissions:
  contents: write

concurrency:
  group: warm-idx-broker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh official public participant cache first
        env:
          PYTHONPATH: src
          IDX_PUBLIC_PARTICIPANT_TARGET_DAYS: '20'
          IDX_PUBLIC_PARTICIPANT_MAX_CALENDAR_DAYS: '45'
        run: python scripts/build_public_participant_cache.py
      - name: Pull universe-wide stock-level IDX broker summary plus participant fallback
        env:
          PYTHONPATH: src
          IDX_BROKER_UNIVERSE_DAILY_BUDGET: '400'
          IDX_BROKER_WORKERS: '12'
          IDX_BROKER_TARGET_DAYS: '20'
          IDX_BROKER_MAX_CALENDAR_DAYS: '45'
        run: python scripts/build_idx_broker_cache.py
      - name: Publish telemetry
        if: always()
        run: |
          echo '## IDX broker universe telemetry' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/cache/idx_official_broker_meta.json 2>/dev/null || echo '{"status":"meta_unavailable"}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit semantic IDX evidence changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p data/cache
          git add data/cache/idx_public_participant_30d.csv.gz data/cache/public_participant_meta.json data/cache/idx_official_broker_60d.csv.gz data/cache/idx_official_broker_meta.json
          if git diff --cached --quiet; then
            echo 'IDX broker evidence unchanged; no commit/redeploy'
          else
            git commit -m 'Refresh universe-wide IDX participant and broker evidence'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi