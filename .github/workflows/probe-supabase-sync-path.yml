name: Probe Supabase Sync Path

on:
  push:
    branches:
      - feat/idx-official-announcements-xbrl
    paths:
      - .github/workflows/probe-supabase-sync-path.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Report credential availability only
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_SECRET_KEY SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=present"
            else
              echo "${name}=missing"
            fi
          done
