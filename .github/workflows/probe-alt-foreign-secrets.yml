name: Probe Alternative Foreign Providers

on:
  push:
    branches:
      - fix/foreign700-freefloat-semantics
    paths:
      - '.github/workflows/probe-alt-foreign-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured provider secrets and Index Alpha usage
        env:
          INDEX_ALPHA_KEY: ${{ secrets.INDEX_ALPHA_KEY }}
          INDEXALPHA_KEY: ${{ secrets.INDEXALPHA_KEY }}
          INDEX_ALPHA_API_KEY: ${{ secrets.INDEX_ALPHA_API_KEY }}
          GOAPI_KEY: ${{ secrets.GOAPI_KEY }}
          GO_API_KEY: ${{ secrets.GO_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          names = ['INDEX_ALPHA_KEY','INDEXALPHA_KEY','INDEX_ALPHA_API_KEY','GOAPI_KEY','GO_API_KEY']
          for name in names:
              print(f'{name}=' + ('configured' if os.getenv(name) else 'missing'))
          key = os.getenv('INDEX_ALPHA_KEY') or os.getenv('INDEXALPHA_KEY') or os.getenv('INDEX_ALPHA_API_KEY')
          if key:
              req = urllib.request.Request('https://api.indexalpha.id/usage', headers={'Authorization': f'Bearer {key}', 'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read().decode('utf-8','replace')
                      print('INDEX_ALPHA_USAGE_STATUS', r.status)
                      try:
                          payload = json.loads(body)
                          print('INDEX_ALPHA_USAGE', json.dumps(payload, sort_keys=True))
                      except Exception:
                          print('INDEX_ALPHA_USAGE_BODY', body[:1000])
              except Exception as exc:
                  print('INDEX_ALPHA_USAGE_ERROR', type(exc).__name__, str(exc))
          PY
