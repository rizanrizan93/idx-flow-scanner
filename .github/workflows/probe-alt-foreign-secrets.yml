name: Probe Alternative Foreign Providers

on:
  push:
    branches:
      - fix/foreign700-freefloat-semantics
    paths:
      - '.github/workflows/probe-alt-foreign-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured provider secrets
        env:
          INDEX_ALPHA_KEY: ${{ secrets.INDEX_ALPHA_KEY }}
          INDEXALPHA_KEY: ${{ secrets.INDEXALPHA_KEY }}
          INDEX_ALPHA_API_KEY: ${{ secrets.INDEX_ALPHA_API_KEY }}
          GOAPI_KEY: ${{ secrets.GOAPI_KEY }}
          GO_API_KEY: ${{ secrets.GO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          for name in ['INDEX_ALPHA_KEY','INDEXALPHA_KEY','INDEX_ALPHA_API_KEY','GOAPI_KEY','GO_API_KEY']:
              print(f'{name}=' + ('configured' if os.getenv(name) else 'missing'))
          PY
