name: Probe Block IDX

on:
  push:
    branches:
      - evidence-expansion/block-idx-downloader
    paths:
      - 'scripts/probe_block_idx.py'
      - '.github/workflows/probe-block-idx.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe public Block IDX page and frontend endpoints
        env:
          PYTHONPATH: src
        run: python scripts/probe_block_idx.py
