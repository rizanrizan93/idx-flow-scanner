name: Diagnose Supabase Action Secrets

on:
  push:
    branches:
      - diag/supabase-action-secrets
    paths:
      - '.github/workflows/diag-supabase-secrets.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os, json
          print(json.dumps({
            'SUPABASE_URL_present': bool((os.getenv('SUPABASE_URL') or '').strip()),
            'SUPABASE_SECRET_KEY_present': bool((os.getenv('SUPABASE_SECRET_KEY') or '').strip()),
          }))
          PY
