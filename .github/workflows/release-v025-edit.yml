name: Release v0.2.5 Editor

on:
  push:
    branches:
      - release/v0.2.5-zapi-foreign
    paths:
      - '.github/workflows/release-v025-edit.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.2.5-zapi-foreign
      - name: Apply version and documentation updates
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          old = 'APP_VERSION = "0.2.4"'
          if old not in text:
              raise SystemExit('expected app version marker not found')
          text = text.replace(old, 'APP_VERSION = "0.2.5"', 1)
          text = text.replace(
              '"GOAPI stock-level broker evidence • provenance-gated bandar cost • OOS memory"',
              '"optional GOAPI stock-level broker evidence • provenance-gated bandar cost • OOS memory"',
              1,
          )
          app.write_text(text, encoding='utf-8')

          Path('VERSION').write_text('0.2.5\n', encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = r.replace(
              '- foreign institutional 10% (neutral 50 until a verified provider is wired)',
              '- foreign institutional 10% (direct IDX when available; otherwise audited Zapi IDX-derived share flow; neutral only when verified flow is unavailable)',
              1,
          )
          marker = '## Next production gates\n'
          note = (
              '## v0.2.5 foreign evidence\n\n'
              '- Bundled Zapi IDX-derived foreign-flow cache covers the managed 400-ticker universe for 20 trading days.\n'
              '- Foreign buy/sell/net remain share-unit evidence and are never promoted to broker-direct evidence or bandar cost.\n'
              '- Direct IDX HTTP remains preferred on equal coverage, but cloud 403/Cloudflare failures fail closed.\n'
              '- GOAPI is optional; the scanner remains fully operational in PRICE_PROXY/GUARDED mode when stock-level broker evidence is absent.\n\n'
          )
          if note not in r and marker in r:
              r = r.replace(marker, note + marker, 1)
          readme.write_text(r, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py VERSION README.md
          git commit -m "Release v0.2.5 with production Zapi foreign evidence"
          git push origin HEAD:release/v0.2.5-zapi-foreign
