name: Gate 3 Full Corpus Closure

on:
  push:
    branches:
      - evidence-v5/financial-facts-ingest-staging
    paths:
      - '.github/workflows/gate3-full-corpus-closure.yml'
      - 'scripts/close_gate3_financial_facts.py'
      - 'tests/test_gate3_financial_facts_closure.py'

permissions:
  contents: read
  actions: read

jobs:
  close-gate3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Download immutable Full Proof #4 cache
        uses: actions/download-artifact@v4
        with:
          name: full-financial-facts-cache
          path: gate3-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34211607255

      - name: Close residual Gate 3 failures fail-closed
        id: closure
        continue-on-error: true
        run: >-
          PYTHONPATH=src:. python scripts/close_gate3_financial_facts.py
          --source data/cache/evidence_v5/block_idx_historical_financial_filings.json
          --cache gate3-input/block_idx_financial_facts_full.json
          --output gate3-output/block_idx_financial_facts_gate3_final.json
          --summary gate3-output/gate3_full_corpus_closure_summary.json
          --workers 6
          --timeout 20

      - name: Upload Gate 3 compact closure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3-full-corpus-closure-summary
          path: gate3-output/gate3_full_corpus_closure_summary.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload Gate 3 final classified cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3-full-corpus-final-cache
          path: gate3-output/block_idx_financial_facts_gate3_final.json
          retention-days: 14
          if-no-files-found: warn

      - name: Enforce Gate 3 evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('gate3-output/gate3_full_corpus_closure_summary.json')
          if not path.exists():
              raise SystemExit('GATE3_CLOSURE_SUMMARY_MISSING')
          data=json.loads(path.read_text())
          required={
              'gate3_status':'PASS',
              'selected_filing_rows':12285,
              'distinct_metrics':19,
              'retryable_failure_rows':0,
              'parser_or_contract_failure_rows':0,
              'production_scoring_changed':False,
          }
          bad={k:(data.get(k),v) for k,v in required.items() if data.get(k)!=v}
          if bad:
              raise SystemExit('GATE3_CONTRACT_FAIL:'+json.dumps(bad,sort_keys=True))
          if data.get('parsed_filing_rows',0)+data.get('failed_filing_rows',0)!=data.get('selected_filing_rows'):
              raise SystemExit('GATE3_RECONCILIATION_FAIL')
          if data.get('no_fake_100_percent') is not True:
              raise SystemExit('GATE3_NO_FAKE_100_PERCENT_GUARD_FAIL')
          print(json.dumps({k:v for k,v in data.items() if k!='outcomes'},sort_keys=True))
          PY
