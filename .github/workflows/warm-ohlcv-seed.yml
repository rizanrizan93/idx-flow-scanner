name: Warm OHLCV Seed

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'
  push:
    paths:
      - 'data/cache/REFRESH_REQUEST.txt'
      - 'scripts/build_ohlcv_seed.py'
      - 'scripts/materialize_universe_700.py'
      - 'src/idx_flow_scanner/universe_700.py'
      - '.github/workflows/warm-ohlcv-seed.yml'

permissions:
  contents: write

concurrency:
  # Serialize all workflows that may commit back to the same branch.
  group: warm-zapi-flow-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build 700-ticker OHLCV seed
        env:
          PYTHONPATH: src
          ZAPI_KEY: ${{ secrets.ZAPI_KEY }}
        run: python scripts/build_ohlcv_seed.py
      - name: Commit verified seed and universe snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/universe/idx_700_all.csv \
            data/cache/idx_700_ohlcv_1y.csv.gz \
            data/cache/idx_700_ohlcv_recent.json \
            data/cache/ohlcv_seed_meta.json
          if git diff --cached --quiet; then
            echo "Seed unchanged"
          else
            git commit -m "Refresh bundled 700-ticker OHLCV seed [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
