name: Warm ZAPI Flow Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '40 12 * * 1-5'
  push:
    paths:
      - 'scripts/build_flow_evidence_cache.py'
      - 'scripts/build_flow_evidence_cache_700.py'
      - 'scripts/materialize_universe_700.py'
      - 'src/idx_flow_scanner/evidence_700.py'
      - 'src/idx_flow_scanner/universe_700.py'
      - 'src/idx_flow_scanner/providers/zapi.py'
      - 'src/idx_flow_scanner/providers/zapi_slow.py'
      - 'src/idx_flow_scanner/slow_evidence.py'
      - 'requirements.txt'
      - '.github/workflows/warm-flow-evidence.yml'

permissions:
  contents: write

concurrency:
  group: warm-zapi-flow-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Refresh 700-ticker ZAPI flow and slow evidence
        env:
          PYTHONPATH: src
          ZAPI_KEY: ${{ secrets.ZAPI_KEY }}
          ZAPI_FOREIGN_TARGET_DAYS: '20'
          ZAPI_OWNERSHIP_REFRESH_WEEKDAY: '0'
          ZAPI_OWNERSHIP_PROFILE_FALLBACK_LIMIT: '60'
          ZAPI_OWNERSHIP_TARGET_COVERAGE: '0.90'
          IDX700_SECTOR_WEB_FALLBACK_LIMIT: '350'
          IDX700_SECTOR_WORKERS: '8'
        run: python scripts/build_flow_evidence_cache_700.py

      - name: Publish provider telemetry
        if: always()
        run: |
          echo '## ZAPI Flow evidence telemetry' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat data/cache/flow_evidence_meta.json 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo '{"status":"meta_unavailable"}' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## IDX 700 evidence coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat data/cache/idx_700_evidence_coverage.json 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo '{"status":"coverage_unavailable"}' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit semantic evidence changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/zapi-flow-cache
          mkdir -p /tmp/zapi-flow-cache
          for name in \
            flow_evidence_meta.json \
            idx_700_evidence_coverage.json \
            zapi_idx_foreign_60d.csv.gz \
            zapi_idx_foreign_60d.json \
            zapi_stock_summary_latest.csv.gz \
            zapi_ownership_latest.csv.gz \
            zapi_capital_actions.csv.gz
          do
            test ! -f "data/cache/$name" || cp "data/cache/$name" "/tmp/zapi-flow-cache/$name"
          done
          test ! -f data/universe/idx_700_all.csv || cp data/universe/idx_700_all.csv /tmp/zapi-flow-cache/idx_700_all.csv

          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p data/cache data/universe

          python - <<'PY'
          from __future__ import annotations

          import gzip
          import json
          import shutil
          from pathlib import Path

          current = Path("data/cache")
          fresh = Path("/tmp/zapi-flow-cache")
          changed = False

          def semantic_bytes(path: Path) -> bytes:
              if path.name.endswith(".csv.gz"):
                  with gzip.open(path, "rb") as handle:
                      return handle.read()
              if path.name == "idx_700_evidence_coverage.json":
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  payload.pop("generated_at", None)
                  return json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
              return path.read_bytes()

          evidence_files = (
              "zapi_idx_foreign_60d.csv.gz",
              "zapi_idx_foreign_60d.json",
              "zapi_stock_summary_latest.csv.gz",
              "zapi_ownership_latest.csv.gz",
              "zapi_capital_actions.csv.gz",
              "idx_700_evidence_coverage.json",
          )
          for name in evidence_files:
              new_path = fresh / name
              old_path = current / name
              if not new_path.exists():
                  continue
              same = False
              if old_path.exists():
                  try:
                      same = semantic_bytes(new_path) == semantic_bytes(old_path)
                  except Exception:
                      same = False
              if same:
                  print(f"{name}: semantic evidence unchanged")
                  continue
              shutil.copy2(new_path, old_path)
              changed = True
              print(f"{name}: evidence updated")

          universe = fresh / "idx_700_all.csv"
          if universe.exists():
              target = Path("data/universe/idx_700_all.csv")
              same = target.exists() and universe.read_bytes() == target.read_bytes()
              if not same:
                  shutil.copy2(universe, target)
                  changed = True
                  print("idx_700_all.csv: universe snapshot updated")

          meta = fresh / "flow_evidence_meta.json"
          if changed and meta.exists():
              shutil.copy2(meta, current / meta.name)
          elif meta.exists():
              print("flow_evidence_meta.json: telemetry-only change kept in Actions summary")
          PY

          for name in \
            flow_evidence_meta.json \
            idx_700_evidence_coverage.json \
            zapi_idx_foreign_60d.csv.gz \
            zapi_idx_foreign_60d.json \
            zapi_stock_summary_latest.csv.gz \
            zapi_ownership_latest.csv.gz \
            zapi_capital_actions.csv.gz
          do
            test ! -f "data/cache/$name" || git add "data/cache/$name"
          done
          test ! -f data/universe/idx_700_all.csv || git add data/universe/idx_700_all.csv

          if git diff --cached --quiet; then
            echo "ZAPI evidence unchanged; no repository commit"
          else
            git commit -m "Refresh ZAPI flow evidence cache"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
