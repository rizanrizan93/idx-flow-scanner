name: Warm Flow Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '40 12 * * *'
  push:
    paths:
      - 'scripts/build_flow_evidence_cache.py'
      - 'src/idx_flow_scanner/providers/idx_official.py'
      - 'src/idx_flow_scanner/providers/zapi.py'
      - 'src/idx_flow_scanner/providers/goapi.py'
      - 'src/idx_flow_scanner/providers/indexalpha.py'
      - 'data/config/indexalpha_targets.json'
      - 'src/idx_flow_scanner/foreign_evidence.py'
      - '.github/workflows/warm-flow-evidence.yml'

permissions:
  contents: write

concurrency:
  group: warm-flow-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh audited foreign and broker evidence caches
        env:
          PYTHONPATH: src
          ZAPI_KEY: ${{ secrets.ZAPI_KEY }}
          GOAPI_KEY: ${{ secrets.GOAPI_KEY }}
          GOAPI_DAILY_BUDGET: ${{ vars.GOAPI_DAILY_BUDGET || '5' }}
          INDEX_ALPHA_KEY: ${{ secrets.INDEX_ALPHA_KEY }}
          INDEX_ALPHA_DAILY_BUDGET: ${{ vars.INDEX_ALPHA_DAILY_BUDGET || '5' }}
          IDX_FOREIGN_TARGET_DAYS: '20'
          IDX_FOREIGN_MAX_CALENDAR_DAYS: '45'
          ZAPI_FOREIGN_TARGET_DAYS: '20'
          ZAPI_FOREIGN_MAX_CALENDAR_DAYS: '45'
          IDX_REQUEST_DELAY_SECONDS: '1.0'
        run: python scripts/build_flow_evidence_cache.py
      - name: Commit audited evidence cache
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/flow-evidence-cache
          mkdir -p /tmp/flow-evidence-cache
          cp data/cache/flow_evidence_meta.json /tmp/flow-evidence-cache/
          test ! -f data/cache/idx_official_flow_60d.csv.gz || cp data/cache/idx_official_flow_60d.csv.gz /tmp/flow-evidence-cache/
          test ! -f data/cache/zapi_idx_foreign_60d.csv.gz || cp data/cache/zapi_idx_foreign_60d.csv.gz /tmp/flow-evidence-cache/
          test ! -f data/cache/goapi_broker_60d.csv.gz || cp data/cache/goapi_broker_60d.csv.gz /tmp/flow-evidence-cache/
          test ! -f data/cache/indexalpha_broker_60d.csv.gz || cp data/cache/indexalpha_broker_60d.csv.gz /tmp/flow-evidence-cache/

          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p data/cache

          # Do not let timestamp-only JSON changes or gzip header mtimes create a
          # repository commit. A no-op cache commit can redeploy Streamlit while a
          # managed scan is running, leaving a RUNNING row orphaned in OHLCV_PREP.
          python - <<'PY'
          from __future__ import annotations

          import gzip
          import json
          import shutil
          from pathlib import Path

          cache = Path("data/cache")
          fresh = Path("/tmp/flow-evidence-cache")

          new_meta = fresh / "flow_evidence_meta.json"
          old_meta = cache / "flow_evidence_meta.json"
          if new_meta.exists():
              material_changed = True
              if old_meta.exists():
                  try:
                      new_obj = json.loads(new_meta.read_text(encoding="utf-8"))
                      old_obj = json.loads(old_meta.read_text(encoding="utf-8"))
                      new_obj.pop("generated_at", None)
                      old_obj.pop("generated_at", None)
                      material_changed = new_obj != old_obj
                  except Exception:
                      material_changed = True
              if material_changed:
                  shutil.copy2(new_meta, old_meta)
              else:
                  print("flow_evidence_meta.json: material evidence unchanged; preserving tracked generated_at")

          def uncompressed_bytes(path: Path) -> bytes:
              with gzip.open(path, "rb") as handle:
                  return handle.read()

          for name in (
              "idx_official_flow_60d.csv.gz",
              "zapi_idx_foreign_60d.csv.gz",
              "goapi_broker_60d.csv.gz",
              "indexalpha_broker_60d.csv.gz",
          ):
              new_path = fresh / name
              old_path = cache / name
              if not new_path.exists():
                  continue
              same = False
              if old_path.exists():
                  try:
                      same = uncompressed_bytes(new_path) == uncompressed_bytes(old_path)
                  except Exception:
                      same = False
              if same:
                  print(f"{name}: uncompressed evidence unchanged; preserving tracked gzip")
              else:
                  shutil.copy2(new_path, old_path)
          PY

          git add data/cache/flow_evidence_meta.json
          test ! -f data/cache/idx_official_flow_60d.csv.gz || git add data/cache/idx_official_flow_60d.csv.gz
          test ! -f data/cache/zapi_idx_foreign_60d.csv.gz || git add data/cache/zapi_idx_foreign_60d.csv.gz
          test ! -f data/cache/goapi_broker_60d.csv.gz || git add data/cache/goapi_broker_60d.csv.gz
          test ! -f data/cache/indexalpha_broker_60d.csv.gz || git add data/cache/indexalpha_broker_60d.csv.gz
          if git diff --cached --quiet; then
            echo "Flow evidence cache materially unchanged; no commit and no Streamlit redeploy"
          else
            git commit -m "Refresh audited flow evidence cache [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
